name: Texecom Alarm Bridge
version: "0.2.3"
slug: texecom
description: Connects Texecom alarm panels (ComIP/SmartCom) to Home Assistant via MQTT. Independent project, not affiliated with Texecom.
stage: experimental
url: https://github.com/Basskongen/texecom-hassio
image: ghcr.io/basskongen/texecom
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
services:
  - mqtt:need
homeassistant_api: true
options:
  host: ""
  port: 10001
  udl_code: ""
  mqtt_prefix: texecom
  discovery_prefix: homeassistant
  max_zones: 88
  max_areas: 8
  poll_interval: 5
  read_only: false
  allow_keypress: false
  log_level: info
  part_arm_1: armed_home
  part_arm_2: armed_night
  part_arm_3: armed_vacation
  zone_config: []
  area_config: []
  keypad_enabled: false
  keypad_poll_interval: 0.25
  install_card: true
map:
  - type: homeassistant_config
    read_only: false
schema:
  host: str
  port: port
  udl_code: password
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_prefix: str
  discovery_prefix: str
  max_zones: int(8,200)
  max_areas: int(1,16)
  poll_interval: int(2,60)
  read_only: bool
  allow_keypress: bool
  log_level: list(debug|info|warning|error)
  part_arm_1: list(armed_home|armed_night|armed_vacation|armed_custom_bypass)
  part_arm_2: list(armed_home|armed_night|armed_vacation|armed_custom_bypass)
  part_arm_3: list(armed_home|armed_night|armed_vacation|armed_custom_bypass)
  zone_config:
    - number: int(1,999)
      name: str?
      device_class: str?
  area_config:
    - number: int(1,16)
      name: str?
      part_arm_1: list(armed_home|armed_night|armed_vacation|armed_custom_bypass)?
      part_arm_2: list(armed_home|armed_night|armed_vacation|armed_custom_bypass)?
      part_arm_3: list(armed_home|armed_night|armed_vacation|armed_custom_bypass)?
  legacy_prefix: str?
  keypad_enabled: bool
  keypad_poll_interval: float(0.25,10)
  install_card: bool
