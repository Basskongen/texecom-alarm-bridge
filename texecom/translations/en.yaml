configuration:
  host:
    name: Panel address
    description: IP address or host name of the ComIP / SmartCom module.
  port:
    name: Panel port
    description: TCP port of the ComIP / SmartCom module (normally 10001).
  udl_code:
    name: UDL code
    description: The panel's UDL passcode, 4 to 6 digits.
  max_zones:
    name: Number of zones
    description: Highest zone number to look for.
  max_areas:
    name: Number of areas
    description: Number of areas to read from the panel at start-up.
  part_arm_1:
    name: Part arm 1 shows as
    description: Home Assistant arm state used for part arm 1 (can be overridden per area).
  part_arm_2:
    name: Part arm 2 shows as
    description: Home Assistant arm state used for part arm 2.
  part_arm_3:
    name: Part arm 3 shows as
    description: Home Assistant arm state used for part arm 3.
  zone_config:
    name: Zone overrides
    description: Optional per-zone name and device class (door, motion, smoke, window, ...).
  area_config:
    name: Area overrides
    description: Optional per-area name and part-arm mapping.
  keypad_enabled:
    name: Keypad
    description: Let the keypad card operate the panel.
  keypad_poll_interval:
    name: Keypad display refresh (seconds)
    description: How often the keypad display is read while the keypad is on.
  show_panel_outputs:
    name: Show panel outputs
    description: Show panel output 1-5 as entities in Home Assistant.
  show_control_timers:
    name: Show control timers
    description: Show control timer 1-8 as entities in Home Assistant.
  poll_interval:
    name: Poll interval
    description: Seconds between reads of voltages, tamper flags, clock and event log.
  read_only:
    name: Read only
    description: Never send anything that changes the panel (no arm, disarm or text).
  log_level:
    name: Log level
    description: Amount of logging.
